action('profileAliasSave',async()=>{const u=user(),a=aliasValue($('profileAlias').value);if(!/^[a-z0-9_]{4,20}$/.test(a))throw Error(tr('Usa 4–20 letras, números o guiones bajos|Use 4–20 letters, numbers or underscores'));await runTransaction(db,async tx=>{const own=await tx.get(aliasRef(u));if(own.exists())throw Error('Username already registered');tx.set(doc(db,'UsernameReservations',a),{uid:u.uid});tx.set(aliasRef(u),{alias:a,enabled:false});});forgetRegistrationAlias(u.uid);await loadProfileAlias(epoch);if(needsAlias){const ref=doc(db,'Users',u.uid);if(!(await getDoc(ref)).exists())await setDoc(ref,{name:u.displayName?.trim().slice(0,40)||a,avatar:'👤',photo:''});needsAlias=false;home();}});
action('profileAliasCopy',async()=>{const a=(await getDoc(aliasRef(user()))).data();if(a)await navigator.clipboard.writeText('@'+a.alias);});

let aliasTimer,aliasCheck=0;
$('profileAlias').addEventListener('input',()=>{clearTimeout(aliasTimer);const seq=++aliasCheck;const a=aliasValue($('profileAlias').value),status=$('profileAliasStatus'),box=$('aliasSuggestions');box.replaceChildren();status.style.color='';if(!/^[a-z0-9_]{4,20}$/.test(a)){status.textContent=tr('Usa 4–20 letras, números o guiones bajos|Use 4–20 letters, numbers or underscores');return}status.textContent=tr('Comprobando…|Checking…');aliasTimer=setTimeout(async()=>{try{const taken=(await getDoc(doc(db,'UsernameReservations',a))).exists();if(seq!==aliasCheck||page!=='profilePage'||aliasValue($('profileAlias').value)!==a)return;status.style.color=taken?'#e05b65':'#20a879';status.textContent=taken?tr('Ocupado|Taken'):tr('Disponible (sujeto a reserva)|Available (subject to reservation)');if(taken){for(let i=0;i<3;i++){const alt=a.slice(0,15)+'_'+Math.floor(1000+Math.random()*9000);box.append(button('@'+alt,()=>{$('profileAlias').value=alt;$('profileAlias').dispatchEvent(new Event('input'))}));}}}catch(e){if(seq===aliasCheck)status.textContent=tr('No se pudo comprobar|Could not check availability')}},450)});
let drawerAliasRun=0,drawerAliasOwner=null,drawerAliasText='';
async function refreshDrawerUsername(u){const run=++drawerAliasRun;if(drawerAliasOwner!==u.uid){drawerAliasOwner=u.uid;drawerAliasText='';$('drawerUsername').textContent='';$('drawerUsernameRow').hidden=true;$('drawerUsernameCreate').hidden=true;$('drawerUsernameFeedback').textContent='';}try{const snap=await getDoc(aliasRef(u));if(run!==drawerAliasRun||auth.currentUser?.uid!==u.uid)return;const a=snap.data()?.alias;drawerAliasText=typeof a==='string'&&a?'@'+a:'';$('drawerUsername').textContent=drawerAliasText;$('drawerUsernameRow').hidden=!drawerAliasText;$('drawerUsernameCreate').hidden=!!drawerAliasText;}catch(e){if(run===drawerAliasRun&&auth.currentUser?.uid===u.uid){$('drawerUsernameRow').hidden=true;$('drawerUsernameCreate').hidden=true;drawerAliasText='';$('drawerUsernameFeedback').textContent=tr('No se pudo cargar el identificador|Could not load username');}}}
$('drawerUsernameCopy').onclick=async()=>{if(!drawerAliasText||auth.currentUser?.uid!==drawerAliasOwner)return;try{await navigator.clipboard.writeText(drawerAliasText);$('drawerUsernameFeedback').textContent=tr('Identificador copiado|Username copied');}catch(e){$('drawerUsernameFeedback').textContent=tr('No se pudo copiar|Could not copy username');}};
$('drawerUsernameCreate').onclick=()=>show('profilePage',null,true,true);
onAuthStateChanged(auth,async u=>{try{if(u&&!busyAuth){await u.reload();if(auth.currentUser!==u)return;if(u.emailVerified)await u.getIdToken(true);}await handleAuth(u);}catch(e){notice(e.message);if(auth.currentUser===u&&!u?.emailVerified)home();}});


let fullPhotoTrigger=null;
function openFullPhoto(src,trigger){if(!validImage(src,650000))return;const d=$('fullPhotoDialog');if(d.open)return;fullPhotoTrigger=trigger;d.setAttribute('aria-label',tr('Fotografía|Photo'));$('fullPhotoClose').setAttribute('aria-label',tr('Cerrar|Close'));$('fullPhotoImage').src=src;d.showModal();$('fullPhotoClose').focus();}
$('fullPhotoClose').onclick=()=>$('fullPhotoDialog').close();
$('fullPhotoDialog').addEventListener('close',()=>{$('fullPhotoImage').removeAttribute('src');if(fullPhotoTrigger?.isConnected)fullPhotoTrigger.focus();fullPhotoTrigger=null;});
$('fullPhotoDialog').addEventListener('click',e=>{if(e.target===$('fullPhotoDialog'))$('fullPhotoDialog').close()});
document.addEventListener('pointerdown',e=>{document.querySelectorAll('.reactionPicker:not([hidden])').forEach(p=>{if(!p.contains(e.target))p.hidden=true})});
</script></body></html>
