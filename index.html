const photoOK=v=>typeof v==='string'&&v.length<=120000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(v);
function setPhoto(v){profilePhoto=photoOK(v)?v:'';const img=$('photoPreview');img.hidden=!profilePhoto;if(profilePhoto)img.src=profilePhoto;else img.removeAttribute('src');$('photoFile').value=''}
function photoImage(v){const img=document.createElement('img');img.className='avatarPic';img.alt='';if(photoOK(v))img.src=v;return img}
function dataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
$('photoRemove').onclick=()=>setPhoto('');
$('photoFile').onchange=async()=>{const f=$('photoFile').files[0],n=epoch;if(!f)return;const url=URL.createObjectURL(f);$('saveProfile').disabled=true;try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas'),scale=Math.min(1,256/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let v=c.toDataURL('image/jpeg',.8);if(v.length>120000)v=c.toDataURL('image/jpeg',.45);if(!photoOK(v))throw Error(tr('Foto demasiado grande|Photo too large'));if(n===epoch)setPhoto(v)}catch(e){if(n===epoch)notice(e.message)}finally{URL.revokeObjectURL(url);$('saveProfile').disabled=false}};
async function syncProfile(id,u){try{const p=(await getDoc(doc(db,'Users',u.uid))).data();if(p?.name)await setDoc(doc(db,'Chats',id,'Profiles',u.uid),{name:p.name,avatar:p.avatar||'👤',photo:photoOK(p.photo)?p.photo:''})}catch(e){console.warn('Profile sync',e.code)}}
const audioOK=v=>typeof v==='string'&&v.length<=700000&&/^data:audio\/(mp4|webm|ogg|mpeg|aac|wav)(;codecs=[A-Za-z0-9._-]+)?;base64,[A-Za-z0-9+/=]+$/.test(v);
function messageContent(m){if(m.type!=='voice')return text('div',m.text||'');if(!audioOK(m.audio))return text('div',tr('Audio no disponible|Audio unavailable'));const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=m.audio;return a}
function releaseMic(){clearTimeout(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function cancelVoice(){voiceToken++;if(rec&&rec.state!=='inactive')rec.stop();rec=null;releaseMic();voiceData='';voiceDuration=0;const a=$('voicePreview');a.pause();a.removeAttribute('src');a.load();a.hidden=true;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('voicePanel').hidden=true;$('voiceSend').disabled=true;$('voiceStop').disabled=false}
$('voiceCancel').onclick=cancelVoice;$('voiceStop').onclick=()=>{if(rec?.state==='recording')rec.stop()};
$('record').onclick=async()=>{if(page!=='chatPage'||!chatReady||!$('voicePanel').hidden)return;const token=++voiceToken,n=epoch;$('voicePanel').hidden=false;$('voiceStatus').textContent=tr('Permite el micrófono|Allow microphone');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error(tr('Grabación no compatible|Recording unsupported'));const st=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==voiceToken||n!==epoch){st.getTracks().forEach(t=>t.stop());return}stream=st;const mime=['audio/mp4','audio/webm;codecs=opus','audio/ogg;codecs=opus'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000});const r=rec,chunks=[];r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onerror=()=>{if(token===voiceToken){cancelVoice();notice(tr('Error de grabación|Recording error'))}};r.onstop=async()=>{if(token!==voiceToken)return;releaseMic();try{voiceDuration=Math.min(30,Math.max(.1,(Date.now()-started)/1000));const type=(r.mimeType||chunks[0]?.type||'audio/mp4').split(';')[0];const blob=new Blob(chunks,{type});const v=await dataURL(blob);if(token!==voiceToken)return;if(!audioOK(v))throw Error(tr('Audio demasiado grande o incompatible|Audio too large or unsupported'));voiceData=v;previewUrl=URL.createObjectURL(blob);$('voicePreview').src=previewUrl;$('voicePreview').hidden=false;$('voiceStop').disabled=true;$('voiceSend').disabled=false;$('voiceStatus').textContent=tr('Escucha antes de enviar|Listen before sending')}catch(e){if(token===voiceToken){cancelVoice();notice(e.message)}}};r.start();started=Date.now();$('voiceStatus').textContent=tr('Grabando (máximo 30 s)|Recording (30 s max)');timer=setTimeout(()=>{if(r.state==='recording')r.stop()},29500)}catch(e){if(token===voiceToken){cancelVoice();notice(e.message)}}};
$('voiceSend').onclick=async()=>{if(!voiceData||page!=='chatPage'||!chatReady||$('voiceSend').disabled)return;const n=epoch,id=active,token=voiceToken;$('voiceSend').disabled=true;try{await addDoc(collection(db,'Chats',id,'Messages'),{senderId:user().uid,type:'voice',audio:voiceData,duration:voiceDuration,createdAt:serverTimestamp()});if(token===voiceToken)cancelVoice()}catch(e){if(n===epoch&&token===voiceToken){notice(e.message);$('voiceSend').disabled=false}}};
let invite=new URLSearchParams(location.search).get('invite');onAuthStateChanged(auth,u=>{if(busyAuth)return;home();if(u?.emailVerified&&invite&&/^[a-f0-9-]{36}$/i.test(invite)){show('joinPage');$('code').value=invite;invite=null;const url=new URL(location.href);url.searchParams.delete('invite');history.replaceState(null,'',url)}});
</script></body></html>
