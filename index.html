<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNFCHAT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:white;font-family:Arial,sans-serif}header{background:#17243b;padding:18px;text-align:center;font-size:23px;font-weight:bold}.panel{max-width:700px;margin:auto;padding:16px}input,button{font:inherit;padding:12px;border:0;border-radius:10px}input{background:#fff;color:#111;min-width:0}button{background:#16a085;color:white;cursor:pointer}button:disabled{opacity:.5}#auth{display:grid;gap:10px;max-width:420px;margin:30px auto}#auth input{width:100%}#chatScreen{display:none}#chat{height:calc(100dvh - 185px);overflow-y:auto;padding:15px}.message{background:#263750;padding:12px;margin:10px 0;border-radius:12px;overflow-wrap:anywhere;max-width:85%}.mine{background:#146c56;margin-left:auto}.who{font-size:12px;opacity:.8;margin-bottom:5px}footer{display:flex;padding:12px;gap:8px;background:#17243b}footer input{flex:1}#status{color:#cbd5e1;font-size:13px;min-height:18px}#logout{float:right;font-size:12px;padding:8px}#chatTitle{text-align:center;padding:10px}html, body {
  width: 100%;
  margin: 0;
  overflow-x: hidden;
}

body {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

#chatScreen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

#chatScreen:not([style*="display: none"])[style*="display: block"] {
  display: flex !important;
  flex-direction: column;
}

#chat {
  flex: 1;
  height: auto;
  min-height: 0;
  overflow-y: auto;
}

.panel {
  width: 100%;
  max-width: 700px;
  overflow-wrap: anywhere;
}

#adminPanel input {
  width: 100%;
  margin-bottom: 8px;
}

#adminPanel button {
  width: 100%;
}

input, button {
  font-size: 16px;
}

footer {
  flex-shrink: 0;
  width: 100%;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

footer input {
  min-width: 0;
  flex: 1;
}
</style>
</head>
<body>
<header>💬 DNFCHAT</header>
<section id="auth" class="panel">
<h2>Bienvenido a DNFCHAT</h2>
<input id="email" type="email" placeholder="Correo electrónico" autocomplete="email">
<input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
<button id="login">Iniciar sesión</button>
<button id="register" type="button">Crear cuenta</button>
<p id="authStatus" role="status"></p>
</section>
<section id="chatScreen">
  <div id="requestPanel" class="panel" hidden>
  <h3>🔒 Solicitar acceso</h3>
  <p>Solicita permiso para entrar al chat Familia.</p>
  <button id="requestAccess" type="button">
    Solicitar acceso
  </button>
  <p id="requestStatus" role="status"></p>
</div>
 <div id="adminPanel" class="panel" hidden>
  <h3>👨‍👩‍👧‍👦 Administrar Familia</h3>
  <input id="newMemberUid" placeholder="UID del familiar" autocomplete="off">
  <button id="addMember" type="button">Agregar familiar</button>
  <p id="memberStatus" role="status"></p>
  <p id="memberCount"></p> 
   <hr>
<h3>👥 Administrar miembros</h3>
<div id="membersList"></div>
<p id="manageStatus" role="status"></p>
<hr>
<h3>📩 Solicitudes pendientes</h3>
<div id="requestsList"></div>
<p id="requestsStatus" role="status"></p>
</div>
<div class="panel"><button id="logout">Salir</button><div id="chatTitle">Chat Familia</div><div id="status" role="status"></div></div>
<main id="chat" aria-label="Mensajes"></main>
<footer><input id="message" placeholder="Escribe un mensaje" maxlength="2000"><button id="send">Enviar</button></footer>
</section>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,collection,query,orderBy,limit,onSnapshot,addDoc,serverTimestamp,runTransaction,documentId} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

import {setDoc, where} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
 apiKey: 'AIzaSyAkKgPjKQwgDyuaiS_rPsa0mIN2T5teTuQ',
 authDomain: 'dnfchat-2b3db.firebaseapp.com',
 projectId: 'dnfchat-2b3db',
 storageBucket: 'dnfchat-2b3db.firebasestorage.app',
 messagingSenderId: '988967269966',
 appId: '1:988967269966:web:5da301e5fd32058f80351f'
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let stopMessages=null,member=false;
const familyId='NYLW64dACrpPLRO1ml8n'; // Debe coincidir exactamente con el ID del documento Chats en Firestore.
function mostrarMiembros(members, nombres, adminUid) {
  const lista = $('membersList');
  lista.replaceChildren();

  members.forEach(uid => {
    const item = document.createElement('div');
    item.className = 'message';

    const nombre = document.createElement('p');
    nombre.textContent = nombres[uid] || 'Familiar';

    item.append(nombre);

    if (uid === adminUid) {
      const rol = document.createElement('p');
      rol.textContent = '🛡️ Administrador';
      item.append(rol);
    } else {
      const boton = document.createElement('button');
      boton.textContent = 'Eliminar miembro';
      boton.style.background = '#b93838';
      boton.onclick = () => eliminarMiembro(uid);
      item.append(boton);
    }

    lista.append(item);
  });
}
  
async function eliminarMiembro(uid) {
  const user = auth.currentUser;
  if (!user) return;

  if (uid === user.uid) {
    alert('No puedes eliminar al administrador.');
    return;
  }

  if (!confirm('¿Deseas retirar el acceso a este familiar?')) {
    return;
  }

  const status = $('manageStatus');

  try {
    const ref = doc(db, 'Chats', familyId);

    await runTransaction(db, async tx => {
      const snap = await tx.get(ref);

      if (!snap.exists()) {
        throw new Error('Grupo no encontrado');
      }

      const data = snap.data();

      if (data.adminUid !== user.uid) {
        throw new Error('No autorizado');
      }

      if (uid === data.adminUid) {
        throw new Error('Administrador protegido');
      }

      const members = data.members.filter(
        id => id !== uid
      );

      tx.update(ref, { members });
    });

    alert('Miembro eliminado correctamente.');
    location.reload();

  } catch (error) {
    status.textContent = error.message;
  }
}

$('requestAccess').onclick = async () => {
  const user = auth.currentUser;
  if (!user || member) return;

  const button = $('requestAccess');
  const status = $('requestStatus');

  button.disabled = true;

  try {
    const ref = doc(db, 'Chats', familyId,
      'Requests', user.uid);

    const snap = await getDoc(ref);

    if (snap.exists()) {
      const estado = snap.data().status;

      status.textContent =
        estado === 'pending'
        ? 'Tu solicitud está pendiente.'
        : estado === 'accepted'
        ? 'Solicitud aceptada. Recarga la app.'
        : 'Tu solicitud fue rechazada.';

      return;
    }

    await setDoc(ref, {
      email: user.email,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    status.textContent =
      'Solicitud enviada correctamente.';

  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
};


async function responderSolicitud(uid, aceptar) {
  const user = auth.currentUser;
  if (!user) return;

  const chatRef = doc(db, 'Chats', familyId);
  const requestRef = doc(
    db, 'Chats', familyId, 'Requests', uid
  );

  try {
    await runTransaction(db, async tx => {
      const chat = await tx.get(chatRef);
      const solicitud = await tx.get(requestRef);

      if (!chat.exists() ||
          chat.data().adminUid !== user.uid) {
        throw new Error('No autorizado');
      }

      if (!solicitud.exists() ||
          solicitud.data().status !== 'pending') {
        throw new Error('Solicitud no disponible');
      }

      if (aceptar) {
        const members = [...new Set([
          ...chat.data().members, uid
        ])];

        tx.update(chatRef, {members});
      }

      tx.update(requestRef, {
        status: aceptar ? 'accepted' : 'rejected'
      });
    });

    $('requestsStatus').textContent = aceptar
      ? 'Solicitud aceptada correctamente.'
      : 'Solicitud rechazada.';

  } catch (error) {
    $('requestsStatus').textContent = error.message;
  }
}


let stopRequests = null;

function mostrarSolicitudes() {
  if (stopRequests) stopRequests();

  const ref = collection(
    db, 'Chats', familyId, 'Requests'
  );

  const q = query(
    ref, where('status', '==', 'pending')
  );

  stopRequests = onSnapshot(q, snap => {
    const lista = $('requestsList');
    lista.replaceChildren();

    if (snap.empty) {
      lista.textContent = 'No hay solicitudes pendientes.';
      return;
    }

    snap.forEach(d => {
      const item = document.createElement('div');
      item.className = 'message';

      const nombre = document.createElement('p');
      nombre.textContent = d.data().email;

      const aceptar = document.createElement('button');
      aceptar.textContent = '✓ Aceptar';
      aceptar.onclick = () =>
        responderSolicitud(d.id, true);

      const rechazar = document.createElement('button');
      rechazar.textContent = '✕ Rechazar';
      rechazar.style.background = '#b93838';
      rechazar.onclick = () =>
        responderSolicitud(d.id, false);

      item.append(nombre, aceptar, rechazar);
      lista.append(item);
    });
  }, error => {
    $('requestsStatus').textContent = error.message;
  });
}


async function agregarFamiliar(uid) {
  const user = auth.currentUser;
  uid = uid.trim();

  if (!user || !uid || uid.includes('/') ||
      uid.length > 128) {
    throw new Error('UID no válido');
  }

  const ref = doc(db, 'Chats', familyId);

  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);

    if (!snap.exists()) {
      throw new Error('Grupo no encontrado');
    }

    const data = snap.data();

    if (data.adminUid !== user.uid ||
        !Array.isArray(data.members) ||
        !data.members.includes(user.uid)) {
      throw new Error('No eres administrador');
    }

    if (data.members.includes(uid)) {
      throw new Error('Familiar ya agregado');
    }

    tx.update(ref, {
      members: [...data.members, uid]
    });
  });
}

$('addMember').onclick = async () => {
  const uid = $('newMemberUid').value.trim();
  const status = $('memberStatus');
  const button = $('addMember');

  button.disabled = true;
  status.textContent = 'Agregando familiar...';

  try {
    await agregarFamiliar(uid);
    status.textContent = 'Familiar agregado correctamente';
    $('newMemberUid').value = '';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
};

function errorText(e){const map={'auth/email-already-in-use':'Ese correo ya está registrado.','auth/invalid-email':'Correo electrónico no válido.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/weak-password':'La contraseña es demasiado corta.','auth/operation-not-allowed':'Activa Email/Password en Firebase Authentication.','permission-denied':'No tienes permiso para acceder a este chat.'};return map[e.code]||e.message||'Ocurrió un error';}
function credentials(){return {email:$('email').value.trim(),password:$('password').value};}
$('register').onclick=async()=>{const {email,password}=credentials();$('authStatus').textContent='Creando cuenta...';try{await createUserWithEmailAndPassword(auth,email,password)}catch(e){$('authStatus').textContent=errorText(e)}};
$('login').onclick=async()=>{const {email,password}=credentials();$('authStatus').textContent='Iniciando sesión...';try{await signInWithEmailAndPassword(auth,email,password)}catch(e){$('authStatus').textContent=errorText(e)}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
  if (stopRequests) {
  stopRequests();
  stopRequests = null;
}
  $('adminPanel').hidden = true;
  $('requestPanel').hidden = true;
$('requestStatus').textContent = '';
$('requestsList').replaceChildren();
$('requestsStatus').textContent = '';
 if(stopMessages){stopMessages();stopMessages=null}member=false;$('chat').replaceChildren();
 $('auth').style.display=user?'none':'grid';$('chatScreen').style.display=user?'block':'none';
 if(!user){$('authStatus').textContent='';return}
 $('status').textContent='Comprobando acceso al grupo Familia...';
 try{
  const chatRef=doc(db,'Chats',familyId),snapshot=await getDoc(chatRef);
  if(auth.currentUser?.uid!==user.uid)return;
  if(!snapshot.exists()){ $('status').textContent='No existe el chat Familia. Revisa su ID en Firestore.';return }
  
const members = snapshot.data().members;

if (!Array.isArray(members) || !members.includes(user.uid)) {
  $('requestPanel').hidden = false;
  $('status').textContent = 'Solicita acceso al chat Familia.';
  return;
}

const nombres = Object.create(null);

await Promise.all(members.map(async uid => {
  try {
    const perfil = await getDoc(doc(db, 'Users', uid));

    nombres[uid] = perfil.exists()
      ? perfil.data().name || 'Familiar'
      : 'Familiar';
  } catch (error) {
    nombres[uid] = 'Familiar';
  }
}));

if (auth.currentUser?.uid !== user.uid) return;

  member=true;$('status').textContent='Conectado como '+user.email;
   
$('adminPanel').hidden =
  snapshot.data().adminUid !== user.uid;

if (snapshot.data().adminUid === user.uid) {
  mostrarSolicitudes();
  mostrarMiembros(members, nombres, snapshot.data().adminUid);
}
$('memberCount').textContent =
  'Miembros autorizados: ' + members.length;
  const messages=query(collection(db,'Chats',familyId,'Messages'),orderBy('createdAt','desc'),limit(100));
  stopMessages=onSnapshot(messages,snap=>{
   const box=$('chat');box.replaceChildren();
   snap.docs.reverse().forEach(d=>{
    const data=d.data(),item=document.createElement('div');item.className='message'+(data.senderId===user.uid?' mine':'');
     const who = document.createElement('div');
who.className = 'who';
who.textContent = data.senderId === user.uid
  ? 'Tú'
  : (nombres[data.senderId] || 'Familiar');
    const body=document.createElement('div');body.textContent=data.text||'';
  const hora = document.createElement('div');

hora.style.fontSize = '11px';
hora.style.opacity = '0.7';
hora.style.textAlign = 'right';
hora.style.marginTop = '6px';

hora.textContent = data.createdAt
  ? data.createdAt.toDate().toLocaleString('es-DO', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    })
  : 'Pendiente';

item.append(who, body, hora);
box.append(item);
   });box.scrollTop=box.scrollHeight;
  },e=>{$('status').textContent='Error al leer mensajes: '+errorText(e)});
} catch (e) {
  if (auth.currentUser?.uid !== user.uid) return;

  if (e.code === 'permission-denied') {
    $('requestPanel').hidden = false;
    $('status').textContent =
   'Solicita acceso al chat Familia - V4.';
  } else {
    $('status').textContent = errorText(e);
  }
}
});
async function sendMessage(){const user=auth.currentUser,text=$('message').value.trim();if(!user||!member||!text)return;
 $('send').disabled=true;
 try{await addDoc(collection(db,'Chats',familyId,'Messages'),{text,senderId:user.uid,createdAt:serverTimestamp()});$('message').value=''}
 catch(e){$('status').textContent='Error al enviar: '+errorText(e)}finally{$('send').disabled=false}
}
$('send').onclick=sendMessage;
$('message').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
</script>
</body>
</html>
