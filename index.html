$('messagePhoto').onchange=async()=>{const f=$('messagePhoto').files[0],id=active,n=epoch;try{if(!f||!chatReady)return;const photo=await compress(f,650000,1000);if(n!==epoch||!confirm(tr('¿Enviar fotografía?|Send photo?')))return;await addDoc(collection(db,'Chats',id,'Messages'),{senderId:user().uid,type:'photo',photo,createdAt:serverTimestamp(),...(replyId?{replyTo:replyId}:{})});if(n===epoch)resetReply()}catch(e){if(n===epoch)notice(e.message)}finally{$('messagePhoto').value=''}};
async function react(id,mid,emoji){const r=doc(db,'Chats',id,'Messages',mid,'Reactions',user().uid);await runTransaction(db,async tx=>{const s=await tx.get(r);if(s.data()?.emoji===emoji)tx.delete(r);else tx.set(r,{emoji})})}
let reactionStops=[];function watchReactions(id,rows,n,render){reactionStops.forEach(f=>f());reactionStops=[];for(const m of rows){const stop=onSnapshot(collection(db,'Chats',id,'Messages',m.mid,'Reactions'),s=>{if(n!==epoch)return;m.reactionCounts={};s.forEach(x=>{const e=x.data().emoji;m.reactionCounts[e]=(m.reactionCounts[e]||0)+1});render()},()=>{});reactionStops.push(stop)} } 
$('privacy').onclick=()=>show('privacyPage');
$('openDelete').onclick=()=>{user();$('accountSettings').hidden=false;$('openDelete').hidden=true;$('deletePassword').focus()};
action('changePassword',async()=>{const u=user();await sendPasswordResetEmail(auth,u.email);notice(tr('Revisa tu correo|Check your email'))});
let invite=new URLSearchParams(location.search).get('invite');onAuthStateChanged(auth,async u=>{if(busyAuth)return;if(u?.emailVerified){try{const ref=doc(db,'Users',u.uid);const snap=await getDoc(ref);if(auth.currentUser?.uid!==u.uid)return;if(!snap.exists()&&u.displayName?.trim()){await setDoc(ref,{name:u.displayName.trim().slice(0,40),avatar:'👤',photo:''})}}catch(e){home();notice(e.message);return}}if((auth.currentUser?.uid||null)!==(u?.uid||null))return;home();if(u?.emailVerified&&invite&&/^[a-f0-9-]{36}$/i.test(invite)){show('joinPage');$('code').value=invite;invite=null;const url=new URL(location.href);url.searchParams.delete('invite');history.replaceState(null,'',url)}});

document.addEventListener('pointerdown',e=>{document.querySelectorAll('.reactionPicker:not([hidden])').forEach(p=>{if(!p.contains(e.target))p.hidden=true})});
</script></body></html>
