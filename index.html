
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>DNFCHAT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #17243b;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    #chat {
      height: calc(100dvh - 150px);
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      background: #263750;
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .mine {
      background: #146c56;
      margin-left: 15%;
    }
    footer {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: #17243b;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #16a085;
      color: white;
      border: 0;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>💬 DNFCHAT</header>

  <main id="chat">
    <div class="message">
      Bienvenido a DNFCHAT 👋
    </div>
  </main>

  <footer>
    <input id="message"
           placeholder="Escribe un mensaje">
    <button onclick="sendMessage()">
      Enviar
    </button>
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement("div");
      message.className = "message mine";
      message.textContent = text;

      const chat = document.getElementById("chat");
      chat.appendChild(message);
      input.value = "";
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
